<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dramasubs Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

  <style>
    /* Hapus icon GitHub & Rapikan Layout tanpa sidebar */
    .github-corner { display: none !important; }
    
    /* Agar konten tidak terlalu mepet ke kiri karena ga ada sidebar */
    .content {
      left: 0 !important;
      right: 0 !important;
      margin: 0 auto !important;
      max-width: 800px !important;
      position: static !important;
    }
  </style>
</head>
<body>
  <div id="app">Memuat Dokumentasi...</div>
  
  <script>
    window.$docsify = {
      name: 'Dramasubs Docs',
      loadSidebar: false, // WAJIB FALSE karena file _sidebar.md ga ada
      auto2top: true,
      subMaxLevel: 3,
      // Fitur Pencarian tetap aktif
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Cari sesuatu...',
        noData: 'Tidak ditemukan!',
        depth: 4
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

</body>
</html>
