<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dramasubs Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css">

  <style>
    /* 2. Hapus Icon GitHub & Rapikan Sidebar */
    .github-corner { display: none !important; }
    
    /* Perbaikan tampilan sidebar agar tidak terlalu mepet */
    .sidebar { padding-top: 20px; }
    
    /* Warna aksen hijau khas Docsify (bisa diganti) */
    :root {
      --docsifytabs-border-color: #ededed;
      --docsifytabs-tab-highlight-color: #42b983;
    }
  </style>
</head>
<body>
  <div id="app">Memuat Dokumentasi...</div>
  
  <script>
    window.$docsify = {
      name: 'Dramasubs Docs',
      loadSidebar: true,    // Pastikan file _sidebar.md sudah ada di repo
      auto2top: true,
      subMaxLevel: 3,
      // Konfigurasi Search
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Cari sesuatu...',
        noData: 'Tidak ditemukan!',
        depth: 4
      },
      // Konfigurasi Dark Mode
      darklightTheme: {
        defaultTheme: 'dark',
        dark: {
          accent: '#42b983',
          background: '#091a28',
        },
        light: {
          accent: '#42b983',
        }
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

</body>
</html>
